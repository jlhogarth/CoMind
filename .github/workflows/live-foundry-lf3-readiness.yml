name: Live Foundry LF-3 Readiness

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lf3-security-compatibility-readiness:
    name: LF-3 migration 007 isolated readiness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_ci
    steps:
      - name: Check out exact workflow candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact checked-out candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf 'Exact LF-3 workflow candidate verified: %s\n' "${GITHUB_SHA}"

      - name: Verify exact PR source and base parents
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EXPECTED_SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE_HEAD: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          actual_base="$(git rev-parse HEAD^1)"
          actual_source="$(git rev-parse HEAD^2)"
          test "${actual_base}" = "${EXPECTED_BASE_HEAD}"
          test "${actual_source}" = "${EXPECTED_SOURCE_HEAD}"
          printf 'Exact LF-3 PR base verified: %s\n' "${actual_base}"
          printf 'Exact LF-3 PR source head verified: %s\n' "${actual_source}"

      - name: Install PostgreSQL client and Python
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client python3

      - name: Verify LF-3 manifest integrity
        run: python3 ./scripts/verify_live_foundry_lf3_manifest.py

      - name: Verify migration 007 in LF-2 production shape
        run: bash ./scripts/test_live_foundry_lf3_security_readiness.sh

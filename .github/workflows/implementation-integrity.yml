name: Implementation Integrity

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: implementation-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  iic-shadow:
    name: IIC-002 multi-control shadow scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run integrity engine tests
        run: python scripts/test_check_implementation_integrity.py

      - name: Run implementation integrity in shadow mode
        run: python scripts/check_implementation_integrity.py . --mode shadow --format json --output integrity-findings.json

      - name: Render findings in job log
        run: cat integrity-findings.json

      - name: Preserve exact-head integrity evidence
        uses: actions/upload-artifact@v4
        with:
          name: iic-002-findings-${{ github.sha }}
          path: integrity-findings.json
          if-no-files-found: error
          retention-days: 14

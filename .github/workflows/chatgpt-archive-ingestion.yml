name: ChatGPT Archive Ingestion

on:
  pull_request:
    paths:
      - 'server/src/archive/**'
      - 'server/test/chatgpt-archive-ingestion*.test.mjs'
      - 'db/migrations/20261012_001_chatgpt_archive_ingestion.sql'
      - 'db/migrations/20261012_002_chatgpt_archive_quarantine.sql'
      - 'db/migrations/20261012_003_chatgpt_archive_access_hardening.sql'
      - 'db/migrations/verify_20261012_001_chatgpt_archive_ingestion.sql'
      - 'db/migrations/verify_20261012_003_chatgpt_archive_access_hardening.sql'
      - 'scripts/test_chatgpt_archive_ingestion.sh'
      - '.devcontainer/Dockerfile'
      - '.github/workflows/chatgpt-archive-ingestion.yml'
      - 'docs/CHATGPT-ARCHIVE-INGESTION.md'
  push:
    branches: [main]
    paths:
      - 'server/src/archive/**'
      - 'server/test/chatgpt-archive-ingestion*.test.mjs'
      - 'db/migrations/20261012_001_chatgpt_archive_ingestion.sql'
      - 'db/migrations/20261012_002_chatgpt_archive_quarantine.sql'
      - 'db/migrations/20261012_003_chatgpt_archive_access_hardening.sql'
      - 'db/migrations/verify_20261012_001_chatgpt_archive_ingestion.sql'
      - 'db/migrations/verify_20261012_003_chatgpt_archive_access_hardening.sql'
      - 'scripts/test_chatgpt_archive_ingestion.sh'
      - '.devcontainer/Dockerfile'
      - '.github/workflows/chatgpt-archive-ingestion.yml'
      - 'docs/CHATGPT-ARCHIVE-INGESTION.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PostgreSQL client and unzip
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client unzip
      - name: Verify lossless and access-hardened ChatGPT archive ingestion
        run: bash scripts/test_chatgpt_archive_ingestion.sh

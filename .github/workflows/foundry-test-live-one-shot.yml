name: Foundry Test live one-shot PROOF handoff

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundry-test-live-one-shot-164
  cancel-in-progress: false

jobs:
  one-shot-live-test:
    name: One approved live Test handoff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      ollama:
        image: ollama/ollama:0.40.8
        env:
          OLLAMA_NO_CLOUD: '1'
          OLLAMA_NUM_PARALLEL: '1'
          OLLAMA_MAX_QUEUE: '1'
        ports:
          - 11434:11434
        options: >-
          --health-cmd "ollama list >/dev/null 2>&1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_MODEL: qwen2.5:0.5b
      FOUNDRY_HANDOFF_ARTIFACT: artifacts/foundry-test-161-live-evidence.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Build Foundry runtime
        working-directory: server
        run: npm run build
      - name: Pull the bounded local model
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/version >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Local Ollama server did not become ready." >&2
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --show-error --max-time 900 \
            -H 'Content-Type: application/json' \
            -d '{"model":"qwen2.5:0.5b","stream":false}' \
            http://127.0.0.1:11434/api/pull
      - name: Install and verify Supabase database CA
        shell: bash
        run: |
          set -euo pipefail
          ca_path="$RUNNER_TEMP/supabase-prod-ca-2021.crt"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt \
            --output "$ca_path"
          expected='807025AD50D4ED219D2C9C7D299C004F824EB00CF7F65AFEF607D07B72E6CAFA'
          actual="$(openssl x509 -in "$ca_path" -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual" != "$expected" ]; then
            echo "Supabase CA fingerprint mismatch. Refusing database connection." >&2
            exit 1
          fi
          echo "NODE_EXTRA_CA_CERTS=$ca_path" >> "$GITHUB_ENV"
      - name: Check live handoff script syntax
        working-directory: server
        run: node --check test/integration/foundry-ollama-live-test-one-shot.e2e.mjs
      - name: Execute one guarded live Test handoff
        working-directory: server
        env:
          SUPABASE_SESSION_DATABASE_URL: ${{ secrets.SUPABASE_SESSION_DATABASE_URL }}
        run: node test/integration/foundry-ollama-live-test-one-shot.e2e.mjs
      - name: Preserve Test readback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-test-161-live-evidence
          path: server/artifacts/foundry-test-161-live-evidence.json
          if-no-files-found: error
          retention-days: 14

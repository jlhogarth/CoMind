name: Live Foundry Stage 1 C4 Payload Freeze

on:
  push:
    branches:
      - issue-127-live-foundry-stage1-deployment

permissions:
  contents: read

concurrency:
  group: live-comind-supabase-schema-mutation
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: bab9c6f162adf1300f6e28d0afc1afb6ac62a681
  PAYLOAD_DIR: /tmp/live-foundry-stage1-payload

jobs:
  freeze-stage1-payload:
    name: Freeze exact authorized Stage 1 SQL payloads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out authorized deployment branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exclusive deployment lease and exact main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          actual_main="$(git rev-parse origin/main)"
          test "${actual_main}" = "${EXPECTED_MAIN_SHA}"
          merge_base="$(git merge-base HEAD origin/main)"
          test "${merge_base}" = "${EXPECTED_MAIN_SHA}"
          changed="$(git diff --name-only "${EXPECTED_MAIN_SHA}"...HEAD)"
          test "${changed}" = ".github/workflows/live-foundry-stage1-c4-deploy.yml"
          printf 'Exact authoritative main lease verified: %s\n' "${actual_main}"

      - name: Verify governed manifest and freeze six exact payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_live_foundry_stage1_manifest.py
          rm -rf "${PAYLOAD_DIR}"
          mkdir -p "${PAYLOAD_DIR}"

          python3 scripts/build_live_foundry_stage1_finops_projection.py \
            --output "${PAYLOAD_DIR}/01_live_foundry_stage1_finops_current_runtime_projection_v1.sql"

          cp db/migrations/20261008_001_paid_provider_budget_authority_hardening.sql \
            "${PAYLOAD_DIR}/02_live_foundry_stage1_paid_provider_budget_authority_hardening_v1.sql"
          cp db/migrations/20261008_002_current_runtime_budget_authority_adapter.sql \
            "${PAYLOAD_DIR}/03_live_foundry_stage1_current_runtime_budget_authority_adapter_v1.sql"
          cp db/migrations/20261008_003_current_runtime_budget_authority_adapter_function_hardening.sql \
            "${PAYLOAD_DIR}/04_live_foundry_stage1_current_runtime_budget_authority_adapter_function_hardening_v1.sql"
          cp db/migrations/20261008_004_current_runtime_budget_authority_adapter_lifecycle_hardening.sql \
            "${PAYLOAD_DIR}/05_live_foundry_stage1_current_runtime_budget_authority_adapter_lifecycle_hardening_v1.sql"
          cp db/migrations/20261008_005_current_runtime_budget_authority_adapter_telemetry_role_hardening.sql \
            "${PAYLOAD_DIR}/06_live_foundry_stage1_current_runtime_budget_authority_adapter_telemetry_role_hardening_v1.sql"

          cp config/live_foundry_stage1_budget_authority_manifest.json "${PAYLOAD_DIR}/manifest.json"
          cp db/verification/live_foundry_stage1_preflight.sql "${PAYLOAD_DIR}/preflight.sql"
          cp db/verification/live_foundry_stage1_postdeploy.sql "${PAYLOAD_DIR}/postdeploy.sql"

          (
            cd "${PAYLOAD_DIR}"
            sha256sum 0*.sql manifest.json preflight.sql postdeploy.sql > SHA256SUMS
            cat SHA256SUMS
          )

      - name: Preserve exact reviewed payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-foundry-stage1-authorized-payloads
          path: /tmp/live-foundry-stage1-payload
          if-no-files-found: error
          retention-days: 7

name: SDN-004 Supabase Test synthetic ingestion

on:
  pull_request:
    paths:
      - 'db/migrations/20261019_001_sdn_test_synthetic_ingestion.sql'
      - 'db/migrations/verify_20261019_001_sdn_test_synthetic_ingestion.sql'
      - 'db/test/bootstrap_supabase_compat.sql'
      - 'scripts/test_sdn_supabase_ingestion.sh'
      - '.github/workflows/sdn-004-test-ingestion.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdn-004-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-postgres-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_ci
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checked-out head
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          printf 'expected_head=%s\nactual_head=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Run idempotency and provenance proof
        run: bash scripts/test_sdn_supabase_ingestion.sh

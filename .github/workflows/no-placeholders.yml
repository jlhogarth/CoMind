name: No Placeholder Policy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  enforce:
    name: Reject unresolved development markers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce no-placeholder policy
        run: python scripts/check_no_placeholders.py .



name: CFR-001F Reconciliation

on:
  pull_request:
    paths:
      - '.github/workflows/cfr-001f-reconciliation.yml'
      - 'db/migrations/20261012_001_chatgpt_archive_ingestion.sql'
      - 'db/migrations/20261012_002_chatgpt_archive_quarantine.sql'
      - 'db/migrations/20261012_003_chatgpt_archive_access_hardening.sql'
      - 'db/migrations/20261025_007_native_chatgpt_live_reconciliation.sql'
      - 'db/migrations/20261025_008_native_chatgpt_live_reconciliation_live_read_boundary.sql'
      - 'db/migrations/20261025_009_native_chatgpt_live_reconciliation_ambiguity_hardening.sql'
      - 'db/migrations/20261025_010_native_chatgpt_live_reconciliation_snapshot_identity.sql'
      - 'db/verification/cfr_001f_*'
      - 'db/sql/v2/**'
      - 'scripts/test_cfr_001f_*.sh'
      - 'server/src/archive/chatgpt-live-reconcile*.ts'
      - 'server/src/archive/reconciliation-db.ts'
      - 'server/test/chatgpt-live-reconciliation.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconciliation:
    name: native archive and live CFR reconciliation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_ci
    steps:
      - name: Check out exact workflow candidate
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Create isolated Supabase API-role fixtures
        run: |
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END;
          $$;
          SQL

      - name: Build server and run deterministic classifier tests
        working-directory: server
        run: |
          npm ci
          npm run build
          node --test test/chatgpt-live-reconciliation.test.mjs

      - name: Verify reconciliation substrate against isolated PostgreSQL
        run: bash ./scripts/test_cfr_001f_reconciliation.sh

      - name: Apply reconciler live-read, ambiguity, and snapshot-identity hardening
        run: |
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -f ./db/migrations/20261025_008_native_chatgpt_live_reconciliation_live_read_boundary.sql
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -f ./db/migrations/20261025_009_native_chatgpt_live_reconciliation_ambiguity_hardening.sql
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -f ./db/migrations/20261025_010_native_chatgpt_live_reconciliation_snapshot_identity.sql

      - name: Verify reconciler can read sources but cannot mutate them
        run: psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -f ./db/verification/cfr_001f_reconciler_live_read_boundary.sql

      - name: Seed active-branch and constrained-login execution fixture
        run: psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -f ./db/verification/cfr_001f_execution_fixture.sql

      - name: Verify constrained reconciliation login preflight
        env:
          COMIND_DATABASE_PURPOSE: chatgpt_reconciliation
          CHATGPT_RECONCILIATION_DATABASE_URL: postgresql://comind_reconciliation_test_login:cfr001f-local-only@localhost:5432/comind_ci
        run: node ./server/dist/archive/chatgpt-live-reconcile-cli.js --preflight-only

      - name: Reconcile exact synthetic pair twice and prove idempotency
        env:
          COMIND_DATABASE_PURPOSE: chatgpt_reconciliation
          CHATGPT_RECONCILIATION_DATABASE_URL: postgresql://comind_reconciliation_test_login:cfr001f-local-only@localhost:5432/comind_ci
        run: |
          first="$(node ./server/dist/archive/chatgpt-live-reconcile-cli.js \
            --import-id f0010001-0000-4000-8000-000000000102 \
            --source-conversation-id native-conversation-1 \
            --cutoff 2026-10-25T18:01:00Z)"
          second="$(node ./server/dist/archive/chatgpt-live-reconcile-cli.js \
            --import-id f0010001-0000-4000-8000-000000000102 \
            --source-conversation-id native-conversation-1 \
            --cutoff 2026-10-25T18:01:00Z)"
          FIRST="${first}" SECOND="${second}" python3 - <<'PY'
          import json
          import os
          first = json.loads(os.environ['FIRST'])
          second = json.loads(os.environ['SECOND'])
          a = first['reconciliation']
          b = second['reconciliation']
          assert first['preflight']['currentUser'] == 'comind_conversation_reconciler'
          assert a['result'] == 'exact_match'
          assert a['matchMethod'] == 'explicit_source_id'
          assert a['selectedConvId'] == 'f0010001-0000-4000-8000-000000000001'
          assert a['reused'] is False
          assert b['reused'] is True
          assert a['reconciliationId'] == b['reconciliationId']
          assert a['receiptSha256'] == b['receiptSha256']
          print('CFR-001F constrained-login reconciliation idempotency PASS')
          PY

      - name: Reconcile extension, live-only partial, conflict, ambiguity, and unmatched cases
        env:
          COMIND_DATABASE_PURPOSE: chatgpt_reconciliation
          CHATGPT_RECONCILIATION_DATABASE_URL: postgresql://comind_reconciliation_test_login:cfr001f-local-only@localhost:5432/comind_ci
        run: bash ./scripts/test_cfr_001f_classifications.sh

      - name: Verify source evidence remained immutable
        run: |
          psql "${DATABASE_URL}" -X -v ON_ERROR_STOP=1 -At <<'SQL'
          SELECT CASE WHEN
            (SELECT count(*) FROM comind.cm_message WHERE conv_id='f0010001-0000-4000-8000-000000000001')=2
            AND (SELECT count(*) FROM comind.cm_archive_node_observation WHERE import_id='f0010001-0000-4000-8000-000000000102')=2
            AND (SELECT count(*) FROM comind.cm_conversation_reconciliation_receipt WHERE import_id='f0010001-0000-4000-8000-000000000102')=2
          THEN 'PASS' ELSE 'FAIL' END;
          SQL

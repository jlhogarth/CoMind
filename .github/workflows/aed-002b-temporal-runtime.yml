name: AED-002B Temporal Runtime Proof

on:
  pull_request:
    paths:
      - 'server/lib/aed-adaptive-liveness.js'
      - 'server/src/aed-temporal/**'
      - 'server/test/aed-adaptive-liveness.test.mjs'
      - 'server/test/aed-temporal-runtime.integration.mjs'
      - 'server/package.json'
      - 'server/package-lock.json'
      - '.github/workflows/aed-002b-temporal-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install exact committed dependency set
        working-directory: server
        run: npm ci

      - name: Verify exact Temporal SDK versions
        working-directory: server
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expected = '1.25.0';
          const names = [
            '@temporalio/activity',
            '@temporalio/client',
            '@temporalio/common',
            '@temporalio/worker',
            '@temporalio/workflow',
          ];
          for (const name of names) {
            if (packageJson.dependencies[name] !== expected) throw new Error(`${name} is not pinned to ${expected}`);
            const installed = JSON.parse(fs.readFileSync(`node_modules/${name}/package.json`, 'utf8')).version;
            if (installed !== expected) throw new Error(`${name} installed ${installed}, expected ${expected}`);
          }
          console.log(JSON.stringify({ status: 'ok', node: process.version, temporalSdk: expected }));
          NODE

      - name: Build and run deterministic server tests
        working-directory: server
        run: |
          npm run build
          npm test

      - name: Start pinned Temporal development service
        run: |
          set -euo pipefail
          docker run --detach --rm \
            --name aed-002b-temporal \
            --publish 7233:7233 \
            temporalio/temporal:1.9.1 \
            server start-dev --ip 0.0.0.0 --headless
          for attempt in $(seq 1 60); do
            if bash -c 'echo > /dev/tcp/127.0.0.1/7233' 2>/dev/null; then
              exit 0
            fi
            if ! docker inspect aed-002b-temporal >/dev/null 2>&1; then
              echo 'Temporal development service exited before becoming ready.' >&2
              exit 1
            fi
            sleep 0.5
          done
          echo 'Temporal development service did not become ready.' >&2
          docker logs aed-002b-temporal || true
          exit 1

      - name: Run durable Signal timer replay and heartbeat proof
        working-directory: server
        env:
          TEMPORAL_ADDRESS: 127.0.0.1:7233
          TEMPORAL_NAMESPACE: default
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/aed-002b-temporal-runtime
          node test/aed-temporal-runtime.integration.mjs \
            | tee ../artifacts/aed-002b-temporal-runtime/runtime-proof.json

      - name: Stage dependency evidence
        if: always()
        run: |
          mkdir -p artifacts/aed-002b-temporal-runtime
          cp server/package.json server/package-lock.json artifacts/aed-002b-temporal-runtime/
          printf '%s\n' '1.25.0' > artifacts/aed-002b-temporal-runtime/temporal-sdk-version.txt
          printf '%s\n' '1.9.1' > artifacts/aed-002b-temporal-runtime/temporal-cli-version.txt

      - name: Upload AED-002B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aed-002b-temporal-runtime
          path: artifacts/aed-002b-temporal-runtime
          if-no-files-found: error
          retention-days: 7

      - name: Stop Temporal development service
        if: always()
        run: docker rm --force aed-002b-temporal >/dev/null 2>&1 || true

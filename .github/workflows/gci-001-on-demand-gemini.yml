name: GCI-001 On-demand Gemini Collaboration
on:
  push:
    branches:
      - gci-001-on-demand-gemini-review
    paths:
      - ".github/workflows/gci-001-on-demand-gemini.yml"
  workflow_dispatch:
    inputs:
      session_id:
        description: "Unique session identifier: 8-80 letters/numbers/_/-"
        required: true
        type: string
      document_id:
        description: "Authorized Google Doc file ID (not a URL)"
        required: true
        type: string
      enable_live:
        description: "Explicitly allow Google API and Gemini calls"
        required: true
        default: false
        type: boolean
      preflight_only:
        description: "Read-only checks for identity, document, exchange, and model"
        default: true
        required: true
        type: boolean
      model:
        description: "Gemini model for review"
        default: "gemini-3.5-flash-lite"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: gci-doc-${{ inputs.document_id }}
  cancel-in-progress: false

jobs:
  offline:
    name: Register workflow or verify disabled dispatch
    if: >-
      github.ref == 'refs/heads/gci-001-on-demand-gemini-review' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && !inputs.enable_live))
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "GCI live access is disabled. No Google or Gemini calls."
  poll:
    if: >-
      github.ref == 'refs/heads/gci-001-on-demand-gemini-review' &&
      github.event_name == 'workflow_dispatch' && inputs.enable_live
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GCI_ENABLE_LIVE: ${{ inputs.enable_live }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/gci/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r scripts/gci/requirements.txt
      - name: Validate parser and protocol
        run: python -m unittest discover -s tests/gci -v
      - name: Authenticate Google Drive (keyless OIDC)
        uses: google-github-actions/auth@v3
        with:
          project_id: comind-513807
          workload_identity_provider: ${{ vars.GCI_WIF_PROVIDER }}
          service_account: ${{ vars.GCI_SERVICE_ACCOUNT_EMAIL }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Run bounded collaboration session
        run: |
          flags=()
          if [[ "$GCI_PREFLIGHT" == "false" ]]; then flags+=(--generate); fi
          python scripts/gci/poller.py \
            --document-id "$GCI_DOC_ID" \
            --session-id "$GCI_SESSION_ID" \
            --model "$GCI_MODEL" \
            --interval 15 --idle 240 --maximum 1800 "${flags[@]}"
        env:
          GCI_PREFLIGHT: ${{ inputs.preflight_only }}
          GCI_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCI_SERVICE_ACCOUNT_EMAIL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCI_DOC_ID: ${{ inputs.document_id }}
          GCI_SESSION_ID: ${{ inputs.session_id }}
          GCI_MODEL: ${{ inputs.model }}

name: Operator Console CI

on:
  pull_request:
    paths:
      - "apps/operator-console/**"
      - ".github/workflows/operator-console.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/operator-console
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/operator-console/package-lock.json
      - name: Install dependencies
        run: npm install --package-lock-only && npm ci
      - name: Verify generated lockfile is committed
        run: git diff --exit-code -- package-lock.json
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

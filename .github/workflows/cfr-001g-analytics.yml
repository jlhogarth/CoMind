name: CFR-001G Analytics and Intent Derivation

on:
  pull_request:
    paths:
      - 'db/migrations/20261025_012_conversation_analytics_intent_derivation.sql'
      - 'db/migrations/20261025_013_conversation_analytics_policy_hardening.sql'
      - 'db/verification/cfr_001g_execution_fixture.sql'
      - 'db/verification/cfr_001g_local_source_read_compat.sql'
      - 'server/src/analytics/**'
      - 'server/test/conversation-derivation.test.mjs'
      - 'scripts/test_cfr_001g_derivation.sh'
      - '.github/workflows/cfr-001g-analytics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-derivation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/comind_ci
      DERIVATION_WORKER_DATABASE_URL: postgresql://cfr_001g_worker:cfr001g-local-only@127.0.0.1:5432/comind_ci
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Typecheck and build deterministic derivation engine
        working-directory: server
        run: npm run build

      - name: Run deterministic derivation unit cases
        working-directory: server
        run: node --test test/conversation-derivation.test.mjs

      - name: Run governed PostgreSQL derivation proof
        run: bash scripts/test_cfr_001g_derivation.sh

      - name: Apply forward source-policy hardening
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f db/migrations/20261025_013_conversation_analytics_policy_hardening.sql

      - name: Re-prove constrained source reads after policy hardening
        env:
          COMIND_DATABASE_PURPOSE: conversation_derivation
          CONVERSATION_DERIVATION_DATABASE_URL: ${{ env.DERIVATION_WORKER_DATABASE_URL }}
        run: |
          node server/dist/analytics/conversation-derive-cli.js --preflight-only
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM pg_policies
              WHERE schemaname='comind'
                AND tablename IN ('cm_conversation','cm_message')
                AND policyname='cm_conversation_deriver_select'
            ) THEN
              RAISE EXCEPTION 'Redundant CFR-001G source-read policy remains after migration 013';
            END IF;
          END
          $$;
          SQL

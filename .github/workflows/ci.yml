name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install server deps
        run: |
          cd server
          npm ci
      - name: Typecheck & build
        run: |
          cd server
          npm run build
      - name: Run server tests
        run: |
          cd server
          npm test
      - name: Audit production dependencies
        run: |
          cd server
          npm audit --omit=dev --audit-level=high

  devcontainer-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify declared devcontainer contract
        run: node scripts/verify_devcontainer_contract.mjs
      - name: Validate compose configuration
        run: docker compose -f .devcontainer/compose.yaml config
      - name: Build and verify devcontainer runtime
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose -f .devcontainer/compose.yaml)
          cleanup() {
            "${compose[@]}" down --volumes --remove-orphans
          }
          trap cleanup EXIT

          "${compose[@]}" up --detach --build

          remote_user="$(node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(".devcontainer/devcontainer.json", "utf8")).remoteUser);')"
          workspace_uid="$("${compose[@]}" exec -T workspace id -u "${remote_user}" | tr -d '\r')"
          workspace_gid="$("${compose[@]}" exec -T workspace id -g "${remote_user}" | tr -d '\r')"
          sudo chown -R "${workspace_uid}:${workspace_gid}" "${GITHUB_WORKSPACE}/server"

          post_create_command="$(node -e 'const fs = require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync(".devcontainer/devcontainer.json", "utf8")).postCreateCommand);')"
          "${compose[@]}" exec -T workspace bash -lc "cd /workspaces/CoMind && ${post_create_command}"

          "${compose[@]}" exec -T workspace bash -lc '
            set -euo pipefail
            [[ "$(id -un)" == node ]]
            node_version="$(node --version)"
            [[ "${node_version}" == v24.* ]]
            psql_version="$(psql --version)"
            [[ "${psql_version}" == *" 17."* ]]
            cd /workspaces/CoMind/server
            npm run build
            npm test
          '

          database_check="$("${compose[@]}" exec -T db psql -U postgres -d comind_runtime -Atc "SELECT current_database(), current_setting('server_version_num')::int >= 170000, EXISTS (SELECT 1 FROM pg_extension WHERE extname='vector');")"
          [[ "${database_check}" == "comind_runtime|t|t" ]]
          printf 'Devcontainer runtime verified: %s\n' "${database_check}"

  pm-ledger-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Verify PM Ledger migrations
        run: ./scripts/test_pm_ledger_migration.sh

  conversation-lifecycle-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Verify conversation lifecycle against isolated PostgreSQL
        run: bash ./scripts/test_conversation_lifecycle.sh

  dev-runtime-verification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_runtime"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_runtime
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Install server dependencies
        run: |
          cd server
          npm ci
      - name: Install browser verification dependency
        run: python -m pip install --disable-pip-version-check selenium==4.50.0
      - name: Bootstrap isolated development runtime
        run: bash ./scripts/bootstrap_dev_runtime.sh
      - name: Verify chat over real HTTP and PostgreSQL
        run: bash ./scripts/verify_chat_runtime.sh
      - name: Verify chat through Chrome and reload persistence
        run: bash ./scripts/verify_chat_browser.sh
      - name: Upload browser verification screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chat-browser-verification
          path: artifacts/chat-browser-verification.png
          if-no-files-found: error
          retention-days: 7

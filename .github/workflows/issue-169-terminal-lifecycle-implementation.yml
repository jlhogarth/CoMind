name: Issue 169 Terminal Lifecycle Implementation

on:
  push:
    branches:
      - foundry-169-terminal-lifecycle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_ci
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: foundry-169-terminal-lifecycle
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Apply Issue 169 implementation
        run: |
          set -euo pipefail
          python3 .github/issue169_patch.py
          git diff --check
          node --check server/test/integration/foundry-ollama-one-shot.e2e.mjs
          node --check server/test/integration/foundry-ollama-live-test-one-shot.e2e.mjs

      - name: Verify isolated terminal lifecycle contract
        run: bash ./scripts/test_foundry_terminal_lifecycle.sh

      - name: Capture implementation diff
        if: always()
        run: |
          git status --short
          git diff --stat
          git diff > issue-169-terminal-lifecycle.patch

      - name: Upload implementation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-169-terminal-lifecycle-patch
          path: issue-169-terminal-lifecycle.patch
          if-no-files-found: error
          retention-days: 14

      - name: Preserve verified implementation
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-169-terminal-lifecycle-implementation.yml
          rm .github/issue169_patch.py
          git add \
            server/src/foundry-runtime.ts \
            server/src/foundry-lifecycle.ts \
            server/test/integration/foundry-terminal-lifecycle.integration.test.mjs \
            server/test/integration/foundry-ollama-one-shot.e2e.mjs \
            server/test/integration/foundry-ollama-live-test-one-shot.e2e.mjs \
            scripts/test_foundry_terminal_lifecycle.sh \
            .github/workflows/foundry-terminal-lifecycle.yml \
            .github/workflows/foundry-test-one-shot-local-handoff.yml \
            .github/workflows/issue-169-terminal-lifecycle-implementation.yml \
            .github/issue169_patch.py
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(foundry): reconcile terminal lifecycle state'
          git push origin HEAD:foundry-169-terminal-lifecycle

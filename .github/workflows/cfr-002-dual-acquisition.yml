name: CFR-002 Dual Acquisition Foundation

on:
  pull_request:
    paths:
      - 'docs/architecture/cfr-002-native-conversation-interface.md'
      - 'db/migrations/20261030_023_cfr_002_dual_acquisition_foundation.sql'
      - 'db/verification/cfr_002_dual_acquisition.sql'
      - 'server/src/conversation-acquisition.ts'
      - 'server/test/conversation-acquisition.test.mjs'
      - 'scripts/test_cfr_002_dual_acquisition.sh'
      - '.github/workflows/cfr-002-dual-acquisition.yml'
      - 'docs/provenance/2026-10-30-cfr-002-dual-acquisition-foundation.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dual-acquisition-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/comind_ci
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run isolated CFR-002 acceptance
        run: bash scripts/test_cfr_002_dual_acquisition.sh

name: Operator Console Lock Refresh

on:
  pull_request:
    paths:
      - "apps/operator-console/package.json"
      - ".github/workflows/operator-console-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lock:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'issue-118-operator-console-live-supabase'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          ref: issue-118-operator-console-live-supabase
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate lockfile from pinned manifest
        working-directory: apps/operator-console
        run: npm install --package-lock-only
      - name: Commit generated lockfile if changed
        run: |
          if git diff --quiet -- apps/operator-console/package-lock.json; then
            echo "Lockfile already matches package.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operator-console/package-lock.json
          git commit -m "OC-002 refresh generated dependency lock"
          git push origin HEAD:issue-118-operator-console-live-supabase

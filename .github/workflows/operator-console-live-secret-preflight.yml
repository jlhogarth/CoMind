name: Operator Console Live Secret Preflight

on:
  push:
    branches:
      - issue-118-operator-console-live-supabase
    paths:
      - ".github/workflows/operator-console-live-secret-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: operator-console-live-secret-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'jlhogarth/CoMind'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://sbgfuanxiqepcoboxzcl.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.operator_console_runtime }}
    steps:
      - name: Validate injected secret without exposing it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_SECRET_KEY:-}" ]]; then
            echo "::error::GitHub secret operator_console_runtime is missing or unavailable to this workflow."
            exit 1
          fi

          case "${SUPABASE_SECRET_KEY}" in
            sb_secret_*)
              echo "operator_console_runtime is present and has the expected modern Supabase secret-key shape."
              ;;
            sb_publishable_*)
              echo "::error::operator_console_runtime contains a Supabase publishable key. The server runtime requires a modern sb_secret_ key."
              exit 1
              ;;
            eyJ*)
              echo "::error::operator_console_runtime contains a legacy JWT-based Supabase API key. OC-002 requires a modern sb_secret_ key for the server runtime."
              exit 1
              ;;
            *)
              echo "::error::operator_console_runtime is present but has an unrecognized key shape. OC-002 requires a modern sb_secret_ key."
              exit 1
              ;;
          esac

      - name: Verify protected live metadata RPC
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          http_code="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request POST \
            --header "apikey: ${SUPABASE_SECRET_KEY}" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "${SUPABASE_URL}/rest/v1/rpc/operator_console_schema_metadata")"

          if [[ "${http_code}" != "200" ]]; then
            echo "::error::Protected metadata RPC returned HTTP ${http_code}."
            exit 1
          fi

          jq -e '
            (.relations | length) == 3 and
            (.foreignKeys | length) == 3 and
            ([.relations[].name] | sort) == ["comments", "posts", "users"]
          ' "${response_file}" >/dev/null

          echo "Protected metadata RPC accepted the runtime secret and returned the approved 3-relation, 3-foreign-key surface."

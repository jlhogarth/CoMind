name: CUX-001 Console Usability Auditor Test one-shot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cux-001-test-agent-one-shot
  cancel-in-progress: false

jobs:
  governed-test-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CUX_AGENT_EVIDENCE: artifacts/cux-001-test-agent-evidence.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            apps/operator-console/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build Foundry runtime and CUX adapter
        working-directory: server
        run: npm run build

      - name: Install Operator Console dependencies
        working-directory: apps/operator-console
        run: npm ci

      - name: Install Chromium
        working-directory: apps/operator-console
        run: npx playwright install --with-deps chromium

      - name: Install and verify Supabase database CA
        shell: bash
        run: |
          set -euo pipefail
          ca_path="$RUNNER_TEMP/supabase-prod-ca-2021.crt"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt \
            --output "$ca_path"
          expected='807025AD50D4ED219D2C9C7D299C004F824EB00CF7F65AFEF607D07B72E6CAFA'
          actual="$(openssl x509 -in "$ca_path" -noout -fingerprint -sha256 \
            | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ "$actual" != "$expected" ]; then
            echo "Supabase CA fingerprint mismatch. Refusing database connection." >&2
            exit 1
          fi
          echo "NODE_EXTRA_CA_CERTS=$ca_path" >> "$GITHUB_ENV"

      - name: Run governed CUX Test agent
        working-directory: server
        env:
          SUPABASE_SESSION_DATABASE_URL: ${{ secrets.SUPABASE_SESSION_DATABASE_URL }}
        run: node scripts/run-cux-001-test-agent.mjs

      - name: Preserve CUX Foundry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cux-001-test-agent-evidence
          path: |
            server/artifacts/cux-001-test-agent-evidence.json
            apps/operator-console/test-results/cux-001/foundry/*.json
          if-no-files-found: error
          retention-days: 14

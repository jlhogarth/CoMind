name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install server deps
        run: |
          cd server
          npm ci
      - name: Typecheck & build
        run: |
          cd server
          npm run build
      - name: Run server tests
        run: |
          cd server
          npm test
      - name: Audit production dependencies
        run: |
          cd server
          npm audit --omit=dev --audit-level=high

  pm-ledger-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Verify PM Ledger migrations
        run: ./scripts/test_pm_ledger_migration.sh

  conversation-lifecycle-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Verify conversation lifecycle against isolated PostgreSQL
        run: bash ./scripts/test_conversation_lifecycle.sh

  dev-runtime-verification:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_runtime"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_runtime
      PORT: 3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Install server dependencies
        run: |
          cd server
          npm ci
      - name: Install browser verification dependency
        run: python -m pip install --disable-pip-version-check selenium==4.50.0
      - name: Bootstrap isolated development runtime
        run: bash ./scripts/bootstrap_dev_runtime.sh
      - name: Verify chat over real HTTP and PostgreSQL
        run: bash ./scripts/verify_chat_runtime.sh
      - name: Verify chat through Chrome and reload persistence
        run: bash ./scripts/verify_chat_browser.sh
      - name: Upload browser verification screenshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chat-browser-verification
          path: artifacts/chat-browser-verification.png
          if-no-files-found: error
          retention-days: 7

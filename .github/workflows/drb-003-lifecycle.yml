name: DRB-003 Lifecycle Contract

on:
  pull_request:
    paths:
      - '.github/workflows/drb-003-lifecycle.yml'
      - 'server/src/runbook/**'
      - 'server/test/runbook-*.test.mjs'
      - 'server/package-lock.json'
      - 'db/migrations/*comind_pm_ledger*.sql'
      - 'db/migrations/*durable_runbook*.sql'
      - 'db/migrations/*drb_004_live_runbook.sql'
      - 'db/test/drb_002_reader.sql'
      - 'db/test/bootstrap_supabase_compat.sql'

permissions:
  contents: read

jobs:
  lifecycle-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: drb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: drb_isolated_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d drb_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node --test test/runbook-lifecycle.test.mjs test/runbook-lifecycle-live.test.mjs test/runbook-query.integration.test.mjs
        env:
          DRB_TEST_ADMIN_URL: postgres://postgres:drb_isolated_ci_only@127.0.0.1:5432/drb_test

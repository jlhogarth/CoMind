name: Operator Console CI

on:
  pull_request:
    paths:
      - "apps/operator-console/**"
      - ".github/workflows/operator-console.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/operator-console
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate dependency lock evidence
        run: npm install --package-lock-only
      - name: Preserve generated dependency lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: operator-console-package-lock
          path: apps/operator-console/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated lockfile correction
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Issue #112: commit authentic generated npm lockfile"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
      - name: Require generated lockfile to be committed
        run: test -z "$(git status --porcelain -- package-lock.json)"
      - name: Install locked dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

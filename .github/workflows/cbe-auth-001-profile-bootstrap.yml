name: CBE-AUTH-001 Profile Bootstrap

on:
  pull_request:
    paths:
      - 'server/scripts/cbe-chatgpt-auth-bootstrap.mjs'
      - 'server/scripts/cbe-chatgpt-auth-check.mjs'
      - 'server/test/cbe-chatgpt-auth-bootstrap.test.mjs'
      - 'server/package.json'
      - '.github/workflows/cbe-auth-001-profile-bootstrap.yml'
      - 'docs/provenance/2026-11-01-cbe-auth-001-profile-bootstrap.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-bootstrap-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate bootstrap script syntax
        run: node --check scripts/cbe-chatgpt-auth-bootstrap.mjs
      - name: Build server regression
        run: npm run build
      - name: Verify authentication and cleanup failure paths
        run: node --test test/cbe-chatgpt-auth-bootstrap.test.mjs
      - name: Verify package command
        run: node -e "const p=require('./package.json'); if(p.scripts['cbe:chatgpt-auth-bootstrap']!=='node scripts/cbe-chatgpt-auth-bootstrap.mjs') process.exit(1)"


name: CoMind Repository Configuration

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-health:
    name: Repository health and Supabase configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository baseline
        shell: bash
        run: |
          set -euo pipefail

          test -f README.md
          test -d .github/workflows
          test -d server
          test -d db

          if find . -type f \( -name '*.zip' -o -name '*.tar' -o -name '*.tar.gz' -o -name '*.tgz' -o -name '*.7z' \) | grep -q .; then
            echo "::error title=Source archive committed::Source archives must stay out of the repository."
            exit 1
          fi

      - name: Require DATABASE_URL secret
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail

          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error title=Missing DATABASE_URL::Add DATABASE_URL as a GitHub Actions repository secret."
            exit 1
          fi

      - name: Require SUPABASE_PROJECT_REF variable
        if: ${{ vars.SUPABASE_PROJECT_REF == '' }}
        shell: bash
        run: |
          echo "::error title=Missing SUPABASE_PROJECT_REF::Add SUPABASE_PROJECT_REF as a GitHub Actions repository variable."
          exit 1

      - name: Confirm required Actions configuration
        shell: bash
        run: |
          echo "Required GitHub Actions configuration is present. Values were not printed."

name: CFR-002B Durable Stream Gateway

on:
  pull_request:
    paths:
      - 'server/src/durable-stream-gateway.ts'
      - 'server/src/conversation-acquisition-store.ts'
      - 'server/test/durable-stream-gateway.test.mjs'
      - '.github/workflows/cfr-002b-durable-stream-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  durable-stream-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Build server
        working-directory: server
        run: npm run build
      - name: Run CFR-002B deterministic acceptance
        working-directory: server
        run: node --test test/durable-stream-gateway.test.mjs

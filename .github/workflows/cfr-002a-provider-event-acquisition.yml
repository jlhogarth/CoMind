name: CFR-002A OpenAI Provider Event Acquisition

on:
  pull_request:
    paths:
      - 'server/src/assistant.ts'
      - 'server/src/providers/openai.ts'
      - 'server/src/routes/assistant.ts'
      - 'server/src/app.ts'
      - 'server/src/conversation-acquisition-store.ts'
      - 'server/src/conversation-acquisition.ts'
      - 'server/test/openai-provider-streaming.test.mjs'
      - 'server/test/integration/assistant-continuity-streaming.test.mjs'
      - 'server/test/integration/conversation-acquisition-store.test.mjs'
      - 'scripts/test_cfr_002a_provider_event_acquisition.sh'
      - '.github/workflows/cfr-002a-provider-event-acquisition.yml'
      - 'docs/provenance/2026-10-30-cfr-002a-openai-provider-event-acquisition.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider-event-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/comind_ci
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Run isolated CFR-002A acceptance
        run: bash scripts/test_cfr_002a_provider_event_acquisition.sh

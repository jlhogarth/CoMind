name: ACP-001 Isolated PostgreSQL
on:
  pull_request:
    paths:
      - 'server/src/continuity/**'
      - 'server/test/continuity-*.test.mjs'
      - 'server/test/continuity-*.integration.test.mjs'
      - 'db/migrations/20261009_acp_continuity_checkpoints.sql'
      - 'scripts/test_acp_continuity.sh'
      - '.github/workflows/acp-continuity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acp-isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Install dependencies
        run: cd server && npm ci
      - name: Verify ACP migration, repository, and confidence gate
        run: bash scripts/test_acp_continuity.sh

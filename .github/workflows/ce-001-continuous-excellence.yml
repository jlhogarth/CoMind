name: CE-001 Continuous Excellence

on:
  pull_request:
    paths:
      - '.github/workflows/ce-001-continuous-excellence.yml'
      - 'AGENTS.md'
      - 'db/migrations/20261029_007_ce_001_continuous_excellence_foundation.sql'
      - 'db/migrations/20261029_008_ce_001_improvement_event_ordering.sql'
      - 'db/migrations/20261029_009_ce_001_operator_view_least_privilege.sql'
      - 'db/migrations/verify_20261029_007_ce_001_continuous_excellence_foundation.sql'
      - 'db/migrations/verify_20261029_008_ce_001_improvement_event_ordering.sql'
      - 'db/migrations/verify_20261029_009_ce_001_operator_view_least_privilege.sql'
      - 'db/test/ce_001_prerequisites.sql'
      - 'scripts/test_ce_001.sh'
      - 'apps/operator-console/src/app/api/continuous-excellence/route.ts'
      - 'apps/operator-console/src/app/continuous-excellence/page.tsx'
      - 'apps/operator-console/src/lib/continuous-excellence/**'
      - 'apps/operator-console/test/continuous-excellence.test.ts'
      - 'apps/operator-console/.env.example'
      - 'docs/governance/continuous-excellence-contract.md'
      - 'docs/architecture/continuous-excellence.md'
      - 'docs/provenance/2026-10-29-ce-001-continuous-excellence-foundation.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_ci
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          printf 'expected_head=%s\nactual_head=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
      - name: Install PostgreSQL client and contrib extensions
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client postgresql-contrib
      - name: Prove Continuous Excellence database contract
        run: bash ./scripts/test_ce_001.sh

  console-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/operator-console
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checked-out head
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          printf 'expected_head=%s\nactual_head=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install exact dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Test Console contract
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://sbgfuanxiqepcoboxzcl.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_only_placeholder
          OPERATOR_CONSOLE_RULEBOOK_ACCESS_MODE: disabled
          OPERATOR_CONSOLE_CE_ACCESS_MODE: disabled
        run: npm run build

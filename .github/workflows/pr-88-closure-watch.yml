name: PR 88 Closure Watch

on:
  schedule:
    - cron: '*/10 * * * *'
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: pr-88-closure-watch
  cancel-in-progress: false

jobs:
  notify-on-closure:
    if: github.event_name != 'pull_request' || github.event.pull_request.number == 88
    runs-on: ubuntu-latest
    steps:
      - name: Check PR 88 and notify once after closure
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = 88;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (pr.state !== 'closed') {
              core.info('PR #88 remains open. No notification.');
              return;
            }
            const marker = '<!-- comind-pr-88-closure-watch -->';
            const { data: existing } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue in:body "${marker}"`,
              per_page: 10
            });
            if (existing.total_count > 0) {
              core.info('Closure already reported. No duplicate notification.');
              return;
            }
            const outcome = pr.merged ? 'merged' : 'closed without merge';
            const { data: notice } = await github.rest.issues.create({
              owner, repo,
              title: `PR #88 ${outcome}: closure notification`,
              body: `${marker}\nPR: ${pr.html_url}\nOutcome: ${outcome}\nHead SHA: ${pr.head.sha}\nThis issue is a one-time closure notice, not an acceptance or merge action.`,
              assignees: ['jlhogarth']
            });
            core.notice(`PR #88 ${outcome}: ${notice.html_url}`);

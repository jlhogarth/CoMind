name: DRULE Conversation Governance Binding

on:
  pull_request:
    paths:
      - '.github/workflows/drule-conversation-governance-binding.yml'
      - 'db/migrations/20261029_001_drule_conversation_governance_binding.sql'
      - 'db/migrations/20261029_002_drule_conversation_governance_binding_hardening.sql'
      - 'db/migrations/20261029_003_drule_conversation_governance_binding_constraints.sql'
      - 'db/migrations/20261029_004_drule_conversation_governance_function_hardening.sql'
      - 'db/test/bootstrap_drule_conversation_governance.sql'
      - 'db/verification/20261029_drule_conversation_governance_binding_verification.sql'
      - 'scripts/test_drule_conversation_governance_binding.sh'
      - 'server/src/providers/conversation-governance-binding.ts'
      - 'server/test/conversation-governance-binding.test.mjs'
      - 'docs/governance/rulebook-control-plane.md'
      - 'docs/provenance/2026-10-29-drule-conversation-governance-binding.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_ci
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          printf 'expected_head=%s\nactual_head=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Verify authoritative conversation governance binding
        run: bash ./scripts/test_drule_conversation_governance_binding.sh

  server-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          printf 'expected_head=%s\nactual_head=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and test server resolver contract
        working-directory: server
        run: |
          npm ci
          npm run build
          npm test

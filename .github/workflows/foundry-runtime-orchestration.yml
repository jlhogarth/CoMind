name: Foundry Runtime Orchestration

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundry-runtime-orchestration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Verify governed Foundry runtime orchestration
        run: bash ./scripts/test_foundry_runtime_orchestration.sh
      - name: Upload isolated checkpoint performance baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-checkpoint-postgres-baseline
          path: artifacts/foundry-checkpoint-postgres-baseline.json
          if-no-files-found: warn
          retention-days: 14

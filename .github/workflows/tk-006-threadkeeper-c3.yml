name: TK-006 ThreadKeeper C3 Integration

on:
  pull_request:
    paths:
      - 'server/src/threadkeeper/**'
      - 'server/src/continuity/**'
      - 'server/src/history/**'
      - 'server/test/threadkeeper-c3-*.test.mjs'
      - 'server/test/threadkeeper-c3-*.integration.test.mjs'
      - 'db/migrations/20261012_001_chatgpt_archive_ingestion.sql'
      - 'db/migrations/20261012_002_chatgpt_archive_quarantine.sql'
      - 'db/migrations/20261012_003_chatgpt_archive_access_hardening.sql'
      - 'db/migrations/20261025_007_native_chatgpt_live_reconciliation.sql'
      - 'db/migrations/20261025_008_native_chatgpt_live_reconciliation_live_read_boundary.sql'
      - 'db/migrations/20261025_009_native_chatgpt_live_reconciliation_ambiguity_hardening.sql'
      - 'db/migrations/20261025_010_native_chatgpt_live_reconciliation_snapshot_identity.sql'
      - 'db/migrations/20261025_011_native_chatgpt_live_reconciliation_policy_hardening.sql'
      - 'db/migrations/20261026_001_conversation_history_reader.sql'
      - 'db/migrations/20261026_002_conversation_history_baseline_certification.sql'
      - 'db/migrations/20261027_002_chatgpt_differential_ingestion.sql'
      - 'db/migrations/20261027_003_chatgpt_differential_recovery_access.sql'
      - 'db/migrations/20261027_004_threadkeeper_c3_history_read_boundary.sql'
      - 'db/migrations/verify_20261027_004_threadkeeper_c3_history_read_boundary.sql'
      - 'db/migrations/20261026_008_threadkeeper_persistence.sql'
      - 'db/migrations/20261026_009_threadkeeper_scope_integrity.sql'
      - 'db/migrations/20261026_010_threadkeeper_fk_indexes.sql'
      - 'scripts/test_threadkeeper_c3.sh'
      - 'config/threadkeeper-c3-evidence.v1.json'
      - 'scripts/threadkeeper_c3_matrix.mjs'
      - 'docs/provenance/*tk-006*'
      - '.github/workflows/tk-006-threadkeeper-c3.yml'
  push:
    branches: [main]
    paths:
      - 'server/src/threadkeeper/**'
      - 'server/src/continuity/**'
      - 'server/src/history/**'
      - 'server/test/threadkeeper-c3-*.test.mjs'
      - 'server/test/threadkeeper-c3-*.integration.test.mjs'
      - 'db/migrations/20261027_004_threadkeeper_c3_history_read_boundary.sql'
      - 'db/migrations/verify_20261027_004_threadkeeper_c3_history_read_boundary.sql'
      - 'scripts/test_threadkeeper_c3.sh'
      - 'config/threadkeeper-c3-evidence.v1.json'
      - 'scripts/threadkeeper_c3_matrix.mjs'
      - 'docs/provenance/*tk-006*'
      - '.github/workflows/tk-006-threadkeeper-c3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c3-real-contract-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_ci
      THREADKEEPER_C3_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      THREADKEEPER_C3_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Prove Conversation History to ThreadKeeper to continuity-handoff integration
        run: bash scripts/test_threadkeeper_c3.sh

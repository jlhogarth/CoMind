name: CHIST-A01 Personal Analytics

on:
  pull_request:
    paths:
      - 'db/migrations/20261026_008_conversation_history_personal_analytics.sql'
      - 'db/migrations/20261026_009_conversation_history_personal_analytics_hash_hardening.sql'
      - 'scripts/test_chist_a01_personal_analytics.sh'
      - 'docs/architecture/chist-a01-personal-analytics.md'
      - '.github/workflows/chist-a01-personal-analytics.yml'
      - 'db/migrations/20261026_004_conversation_history_archive_derivation.sql'
      - 'scripts/test_chist_001_conversation_history.sh'
      - 'scripts/test_chist_001_archive_derivation.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-archive-personal-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/comind_ci
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run CHIST-A01 isolated acceptance
        run: bash scripts/test_chist_a01_personal_analytics.sh

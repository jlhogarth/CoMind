name: MDO-001 Governed Module Development Orchestrator

on:
  pull_request:
    paths:
      - 'db/migrations/20261029_005_mdo_001_governed_module_development_orchestrator.sql'
      - 'db/migrations/verify_20261029_005_mdo_001_governed_module_development_orchestrator.sql'
      - 'scripts/test_mdo_001.sh'
      - 'server/src/mdo-orchestrator.ts'
      - 'server/test/mdo-orchestrator.test.mjs'
      - '.github/workflows/mdo-001.yml'
      - 'docs/provenance/2026-10-29-mdo-001-foundation.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-mdo-proof:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_ci
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          printf 'expected_head=%s\nactual_head=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Run isolated MDO-001 migration and behavior proof
        run: bash ./scripts/test_mdo_001.sh

name: Primary Interface
on:
  pull_request:
    paths:
      - 'apps/primary-interface/**'
      - '.github/workflows/primary-interface.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  human-attention-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test apps/primary-interface/test/*.test.mjs

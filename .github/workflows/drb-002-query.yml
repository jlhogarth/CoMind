name: DRB-002 Query Contract
on:
  pull_request:
    paths: ['server/**', '.github/workflows/drb-002-query.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node --test test/runbook-query.test.mjs

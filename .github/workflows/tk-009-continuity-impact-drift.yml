name: TK-009 Continuity Impact and Drift

on:
  push:
    branches:
      - 'tk-009-continuity-impact-drift'
    paths:
      - 'server/src/continuity/impact.ts'
      - 'server/test/threadkeeper-continuity-impact.test.mjs'
      - 'docs/architecture/threadkeeper-continuity-impact-drift.md'
      - '.github/workflows/tk-009-continuity-impact-drift.yml'
  pull_request:
    paths:
      - 'server/src/continuity/impact.ts'
      - 'server/test/threadkeeper-continuity-impact.test.mjs'
      - 'docs/architecture/threadkeeper-continuity-impact-drift.md'
      - '.github/workflows/tk-009-continuity-impact-drift.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tk-009:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          printf 'expected_head=%s\nactual_head=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Run TK-009 deterministic impact/drift tests
        working-directory: server
        run: node --test test/threadkeeper-continuity-impact.test.mjs

      - name: Run TK-008 regression tests
        working-directory: server
        run: node --test test/threadkeeper-continuity-capsule.test.mjs

      - name: Run non-database server regression suite
        working-directory: server
        run: npm test

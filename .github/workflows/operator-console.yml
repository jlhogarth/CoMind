name: Operator Console CI

on:
  pull_request:
    paths:
      - "apps/operator-console/**"
      - "db/migrations/20261015_001_operator_console_live_activation.sql"
      - "db/migrations/verify_20261015_001_operator_console_live_activation.sql"
      - "scripts/test_operator_console_live_activation.sh"
      - ".github/workflows/operator-console.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/operator-console
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate dependency lock evidence
        run: npm install --package-lock-only
      - name: Preserve generated dependency lock evidence
        uses: actions/upload-artifact@v4
        with:
          name: operator-console-package-lock
          path: apps/operator-console/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Require generated lockfile to be committed
        run: test -z "$(git status --porcelain -- package-lock.json)"
      - name: Install locked dependencies
        run: npm ci
      - name: Reject high or critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  database-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Verify Operator Console live-activation database contract
        run: bash ./scripts/test_operator_console_live_activation.sh

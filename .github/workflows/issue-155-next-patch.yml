name: Issue 155 Operator Console Next patch

on:
  push:
    branches:
      - issue-155-operator-console-next-16-4-1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: issue-155-operator-console-next-16-4-1
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Record tool versions
        run: |
          node --version
          npm --version

      - name: Regenerate exact Next.js patch
        working-directory: apps/operator-console
        run: npm install --save-exact next@16.4.1

      - name: Clean install from regenerated lockfile
        working-directory: apps/operator-console
        run: npm ci

      - name: Typecheck
        working-directory: apps/operator-console
        run: npm run typecheck

      - name: Test
        working-directory: apps/operator-console
        run: npm test

      - name: Build
        working-directory: apps/operator-console
        run: npm run build

      - name: Capture generated diff
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff -- apps/operator-console > issue-155-next-16.4.1.patch
          git diff --stat -- apps/operator-console

      - name: Upload patch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-155-next-16-4-1-patch
          path: issue-155-next-16.4.1.patch
          if-no-files-found: error
          retention-days: 14

      - name: Preserve verified patch on branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/issue-155-next-patch.yml
          git add apps/operator-console .github/workflows/issue-155-next-patch.yml
          git status --short
          if git diff --cached --quiet; then
            echo 'No generated changes found.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(operator-console): update Next.js to 16.4.1'
          git push origin HEAD:issue-155-operator-console-next-16-4-1

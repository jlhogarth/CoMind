name: DRULE-003 Governed Rule Activation

on:
  pull_request:
    paths:
      - '.github/workflows/drule-003-governed-rule-activation.yml'
      - 'db/test/bootstrap_supabase_compat.sql'
      - 'db/migrations/20261006_001_comind_pm_ledger.sql'
      - 'db/migrations/20261006_002_comind_pm_ledger_hardening.sql'
      - 'db/migrations/20261025_012_durable_rulebook_registry.sql'
      - 'db/migrations/20261025_013_drule_002_rule_archaeology_reconciliation.sql'
      - 'db/migrations/20261025_014_drule_003_governed_rule_activation.sql'
      - 'db/sql/20261025_drule_003_founder_authority_seed.sql'
      - 'db/verification/20261025_drule_003_governed_rule_activation_verification.sql'
      - 'scripts/test_drule_003_governed_rule_activation.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governed-rule-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comind_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comind_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/comind_ci
    steps:
      - name: Checkout exact workflow head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact checked-out head
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          printf 'expected_head=%s\nactual_head=%s\n' "$expected" "$actual"
          test "$actual" = "$expected"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Verify DRULE-003 governed rule activation
        run: bash ./scripts/test_drule_003_governed_rule_activation.sh

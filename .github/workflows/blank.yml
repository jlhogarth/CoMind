name: CoMind CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-health:
    name: Repository health and Neon configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository baseline
        shell: bash
        run: |
          set -euo pipefail

          test -f README.md
          test -d .github/workflows

          if find . -type f \( -name '*.zip' -o -name '*.tar' -o -name '*.tar.gz' -o -name '*.tgz' -o -name '*.7z' \) | grep -q .; then
            echo "::error title=Source archive committed::Source archives must stay out of the repository."
            exit 1
          fi

      - name: Require NEON_API_KEY secret
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${NEON_API_KEY:-}" ]; then
            echo "::error title=Missing NEON_API_KEY::Add NEON_API_KEY as a GitHub Actions repository secret."
            exit 1
          fi

      - name: Require NEON_PROJECT_ID variable
        if: ${{ vars.NEON_PROJECT_ID == '' }}
        shell: bash
        run: |
          echo "::error title=Missing NEON_PROJECT_ID::Add NEON_PROJECT_ID as a GitHub Actions repository variable."
          exit 1

      - name: Confirm required Actions configuration
        shell: bash
        run: |
          echo "Required GitHub Actions configuration is present. Values were not printed."

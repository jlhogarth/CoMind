name: DRB-002 Query Contract
on:
  pull_request:
    paths: ['server/**', 'db/**', 'apps/primary-interface/**', '.github/workflows/drb-002-query.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  query-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: drb_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: drb_isolated_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d drb_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: node --test ../apps/primary-interface/test/*.test.mjs
      - run: node --test test/runbook-query.test.mjs test/runbook-security.test.mjs
      - run: node --test test/runbook-query.integration.test.mjs
        env:
          DRB_TEST_ADMIN_URL: postgres://postgres:drb_isolated_ci_only@127.0.0.1:5432/drb_test

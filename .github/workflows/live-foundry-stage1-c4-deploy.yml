name: Live Foundry Stage 1 C4 Read-Only Connection Proof

on:
  push:
    branches:
      - issue-127-live-foundry-stage1-deployment

permissions:
  contents: read

concurrency:
  group: live-comind-supabase-schema-mutation
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: bab9c6f162adf1300f6e28d0afc1afb6ac62a681
  PAYLOAD_DIR: /tmp/live-foundry-stage1-payload

jobs:
  prove-stage1-connection:
    name: Freeze payload and prove read-only Session pooler access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out authorized deployment branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exclusive deployment lease and exact main
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          echo "::add-mask::${DATABASE_URL}"
          git fetch origin main --depth=1
          actual_main="$(git rev-parse origin/main)"
          test "${actual_main}" = "${EXPECTED_MAIN_SHA}"
          merge_base="$(git merge-base HEAD origin/main)"
          test "${merge_base}" = "${EXPECTED_MAIN_SHA}"
          changed="$(git diff --name-only "${EXPECTED_MAIN_SHA}"...HEAD)"
          test "${changed}" = ".github/workflows/live-foundry-stage1-c4-deploy.yml"
          printf 'Exact authoritative main lease verified: %s\n' "${actual_main}"

      - name: Install read-only database client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify governed manifest and freeze six exact payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_live_foundry_stage1_manifest.py
          rm -rf "${PAYLOAD_DIR}"
          mkdir -p "${PAYLOAD_DIR}"

          python3 scripts/build_live_foundry_stage1_finops_projection.py \
            --output "${PAYLOAD_DIR}/01_live_foundry_stage1_finops_current_runtime_projection_v1.sql"

          cp db/migrations/20261008_001_paid_provider_budget_authority_hardening.sql \
            "${PAYLOAD_DIR}/02_live_foundry_stage1_paid_provider_budget_authority_hardening_v1.sql"
          cp db/migrations/20261008_002_current_runtime_budget_authority_adapter.sql \
            "${PAYLOAD_DIR}/03_live_foundry_stage1_current_runtime_budget_authority_adapter_v1.sql"
          cp db/migrations/20261008_003_current_runtime_budget_authority_adapter_function_hardening.sql \
            "${PAYLOAD_DIR}/04_live_foundry_stage1_current_runtime_budget_authority_adapter_function_hardening_v1.sql"
          cp db/migrations/20261008_004_current_runtime_budget_authority_adapter_lifecycle_hardening.sql \
            "${PAYLOAD_DIR}/05_live_foundry_stage1_current_runtime_budget_authority_adapter_lifecycle_hardening_v1.sql"
          cp db/migrations/20261008_005_current_runtime_budget_authority_adapter_telemetry_role_hardening.sql \
            "${PAYLOAD_DIR}/06_live_foundry_stage1_current_runtime_budget_authority_adapter_telemetry_role_hardening_v1.sql"

          cp config/live_foundry_stage1_budget_authority_manifest.json "${PAYLOAD_DIR}/manifest.json"
          cp db/verification/live_foundry_stage1_preflight.sql "${PAYLOAD_DIR}/preflight.sql"
          cp db/verification/live_foundry_stage1_postdeploy.sql "${PAYLOAD_DIR}/postdeploy.sql"

          (
            cd "${PAYLOAD_DIR}"
            sha256sum 0*.sql manifest.json preflight.sql postdeploy.sql > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Build masked Session pooler candidates in runner memory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from urllib.parse import quote_from_bytes, unquote_to_bytes

          raw = os.environ.get("DATABASE_URL", "").strip()
          if not raw:
              raise SystemExit("DATABASE_URL is empty")

          project_ref = "sbgfuanxiqepcoboxzcl"
          direct_host = f"db.{project_ref}.supabase.co"
          pooler_host = "aws-0-us-east-1.pooler.supabase.com"
          marker = "@" + direct_host
          if marker not in raw:
              raise SystemExit("DATABASE_URL does not target the authorized CoMind Supabase direct host")
          if "://" not in raw:
              raise SystemExit("DATABASE_URL has no URI scheme")

          _scheme, rest = raw.split("://", 1)
          userinfo, _suffix = rest.rsplit(marker, 1)
          if ":" not in userinfo:
              raise SystemExit("DATABASE_URL user-info is missing a password separator")
          _username_raw, password_raw = userinfo.split(":", 1)

          username = quote_from_bytes(f"postgres.{project_ref}".encode("utf-8"), safe="")
          raw_password = quote_from_bytes(password_raw.encode("utf-8"), safe="")
          decoded_password = quote_from_bytes(unquote_to_bytes(password_raw), safe="")

          raw_url = f"postgresql://{username}:{raw_password}@{pooler_host}:5432/postgres?sslmode=require"
          decoded_url = f"postgresql://{username}:{decoded_password}@{pooler_host}:5432/postgres?sslmode=require"

          print(f"::add-mask::{raw}")
          print(f"::add-mask::{raw_url}")
          print(f"::add-mask::{decoded_url}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"POOLER_URL_RAW={raw_url}\n")
              env_file.write(f"POOLER_URL_DECODED={decoded_url}\n")
          print("Masked Session pooler candidates prepared without changing the stored secret.")
          PY

      - name: Prove Session pooler authentication with SELECT only
        shell: bash
        run: |
          set -euo pipefail
          if psql "${POOLER_URL_RAW}" -X -v ON_ERROR_STOP=1 -Atqc "select current_database();" >/dev/null 2>/tmp/pooler_raw.err; then
            echo "VERIFIED_DATABASE_URL=${POOLER_URL_RAW}" >> "${GITHUB_ENV}"
            echo 'Session pooler authentication PASS using raw-secret canonicalization.'
          elif [ "${POOLER_URL_DECODED}" != "${POOLER_URL_RAW}" ] && psql "${POOLER_URL_DECODED}" -X -v ON_ERROR_STOP=1 -Atqc "select current_database();" >/dev/null 2>/tmp/pooler_decoded.err; then
            echo "VERIFIED_DATABASE_URL=${POOLER_URL_DECODED}" >> "${GITHUB_ENV}"
            echo 'Session pooler authentication PASS using decoded-secret canonicalization.'
          else
            echo 'Session pooler authentication failed for both masked canonicalization strategies.'
            sed -E 's/password=[^ ]+/password=***/g' /tmp/pooler_raw.err || true
            sed -E 's/password=[^ ]+/password=***/g' /tmp/pooler_decoded.err 2>/dev/null || true
            exit 1
          fi

      - name: Run exact frozen read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          psql "${VERIFIED_DATABASE_URL}" -X -v ON_ERROR_STOP=1 -f "${PAYLOAD_DIR}/preflight.sql"

      - name: Preserve exact reviewed payload artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-foundry-stage1-authorized-payloads
          path: /tmp/live-foundry-stage1-payload
          if-no-files-found: error
          retention-days: 7
